services:
  - type: web
    name: aquasense-api
    runtime: python
    plan: starter
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: AQUASENSE_DATA_DIR
        value: /var/data
      - key: AQUASENSE_CORS_ORIGINS
        value: https://aqua-sense-sih.vercel.app
    disk:
      name: aquasense-storage
      mountPath: /var/data
      sizeGB: 10

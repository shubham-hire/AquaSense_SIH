# AquaSense YOLO26 Marine Debris Dataset Configuration
# SIH 2026 PS 26057 — Side-Scan Sonar Automated Debris Detection

# Path relative to workspace or absolute
path: ./data/yolo_sonar_dataset
train: images/train
val: images/val
test: images/test

# Debris Classes. This is a checked mirror of backend/app/taxonomy.py;
# the regression test prevents it drifting from the production checkpoint.
names:
  0: shipwreck
  1: submarine_pipeline
  2: cylinder
  3: ghost_net
  4: ghost_pot_trap
  5: plastic_debris
  6: metal_debris

# Metadata
nc: 7
description: "Acoustic side-scan sonar dataset combining MILCO/NOMBO, Seabed Objects-KLSG, AI4Shipwrecks, and synthetic ghost-gear composites"

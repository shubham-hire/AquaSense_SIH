name: Model and backend tests

on:
  pull_request:
    paths:
      - "best.pt"
      - "backend/**"
      - "Dockerfile"
      - "render.yaml"
      - ".github/workflows/model-smoke-test.yml"
  push:
    branches: [main]
    paths:
      - "best.pt"
      - "backend/**"
      - "Dockerfile"
      - "render.yaml"
      - ".github/workflows/model-smoke-test.yml"

permissions:
  contents: read

jobs:
  real-model-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Verify checkpoint checksum
        run: echo "342954fdd4ef6a24b89797f68dbeda8ffd9180b1cc7f7f291324c5cee5898f53  best.pt" | sha256sum --check --strict
      - name: Install runtime and test dependencies
        run: python -m pip install -r backend/requirements.txt pytest httpx
      - name: Run checkpoint through AquaSense pipeline
        env:
          PYTHONPATH: backend
          AQUASENSE_MODEL_PATH: ${{ github.workspace }}/best.pt
          AQUASENSE_RUN_REAL_MODEL_TEST: "1"
          AQUASENSE_DEVICE: cpu
          AQUASENSE_BATCH_SIZE: "1"
        run: pytest backend/tests/test_real_model_e2e.py -q

  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependencies
        run: |
          grep -v '^ultralytics' backend/requirements.txt > /tmp/backend-test-requirements.txt
          python -m pip install -r /tmp/backend-test-requirements.txt pytest httpx
      - name: Run backend suite with model unavailable
        env:
          PYTHONPATH: backend
          AQUASENSE_MODEL_PATH: ${{ runner.temp }}/missing-best.pt
        run: pytest backend/tests -q
